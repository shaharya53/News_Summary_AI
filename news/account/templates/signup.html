{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex justify-center items-center font-poppins px-4 relative overflow-hidden bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50">
  <div class="absolute top-10 left-10 w-20 h-20 bg-blue-200 rounded-full opacity-20 animate-float"></div>
  <div class="absolute bottom-20 right-20 w-16 h-16 bg-purple-200 rounded-full opacity-30 animate-float-delayed"></div>
  <div class="absolute top-1/2 left-20 w-12 h-12 bg-indigo-200 rounded-full opacity-25 animate-pulse"></div>
  
  <div class="bg-white/80 backdrop-blur-sm rounded-3xl p-10 max-w-md w-full shadow-2xl animate-fadeIn border border-white/20 relative">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-r from-blue-500 to-purple-600 rounded-2xl mb-4 shadow-lg">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
        </svg>
      </div>
      <h2 class="text-3xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent mb-2">Create Account</h2>
      <p class="text-gray-600 text-sm">Join us and start your journey</p>
    </div>
    
    <form method="POST" class="space-y-5">
      {% csrf_token %}
      <div class="relative group">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <svg class="w-5 h-5 text-gray-400 group-focus-within:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
        </div>
        <input
          type="text"
          name="username"
          placeholder="Username"
          required
          class="w-full pl-12 pr-4 py-4 rounded-xl border-2 border-gray-200 placeholder-gray-400 text-gray-700 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition-all duration-200 bg-gray-50/50 hover:bg-white"
        />
      </div>
      
      <div class="relative group">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <svg class="w-5 h-5 text-gray-400 group-focus-within:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
          </svg>
        </div>
        <input
          type="email"
          name="email"
          placeholder="Email"
          required
          class="w-full pl-12 pr-4 py-4 rounded-xl border-2 border-gray-200 placeholder-gray-400 text-gray-700 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition-all duration-200 bg-gray-50/50 hover:bg-white"
        />
      </div>
      
      <div class="relative group">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <svg class="w-5 h-5 text-gray-400 group-focus-within:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
          </svg>
        </div>
        <input
          type="password"
          name="password"
          placeholder="Password"
          required
          class="w-full pl-12 pr-4 py-4 rounded-xl border-2 border-gray-200 placeholder-gray-400 text-gray-700 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition-all duration-200 bg-gray-50/50 hover:bg-white"
        />
      </div>
      
      <div class="relative group">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <svg class="w-5 h-5 text-gray-400 group-focus-within:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </div>
        <input
          type="password"
          name="confirm_password"
          placeholder="Confirm Password"
          required
          class="w-full pl-12 pr-4 py-4 rounded-xl border-2 border-gray-200 placeholder-gray-400 text-gray-700 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition-all duration-200 bg-gray-50/50 hover:bg-white"
        />
      </div>
      
      <button
        type="submit"
        class="w-full py-4 rounded-xl bg-gradient-to-r from-blue-600 via-blue-700 to-purple-700 font-bold text-white hover:from-blue-700 hover:via-blue-800 hover:to-purple-800 hover:scale-[1.02] hover:shadow-xl transition-all duration-300 shadow-lg relative overflow-hidden group"
      >
        <span class="relative z-10">Create Account</span>
        <div class="absolute inset-0 bg-gradient-to-r from-white/0 via-white/20 to-white/0 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700"></div>
      </button>
    </form>
    
    <div class="mt-6 text-center">
      <p class="text-gray-600 text-sm">
        Already have an account? 
        <a href="{% url 'login' %}" class="text-blue-600 hover:text-purple-600 font-semibold transition-colors duration-200 hover:underline">
          Sign In
        </a>
      </p>
    </div>
  </div>
</div>

<style>
  @keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
  }
  
  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(180deg); }
  }
  
  @keyframes float-delayed {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-15px) rotate(-180deg); }
  }
  
  .animate-fadeIn {
    animation: fadeIn 0.8s ease forwards;
  }
  
  .animate-float {
    animation: float 6s ease-in-out infinite;
  }
  
  .animate-float-delayed {
    animation: float-delayed 8s ease-in-out infinite;
  }
  
  .font-poppins {
    font-family: 'Poppins', sans-serif;
  }
</style>
{% endblock %}
