{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}

<div class="min-h-[80vh] flex justify-center items-center font-poppins px-4 bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-100 relative overflow-hidden">
  <div class="absolute inset-0 overflow-hidden">
    <div class="absolute -top-40 -right-40 w-80 h-80 bg-gradient-to-br from-blue-400/20 to-purple-400/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-gradient-to-tr from-cyan-400/20 to-blue-400/20 rounded-full blur-3xl"></div>
  </div>
  
  <div class="bg-white/80 backdrop-blur-xl rounded-3xl p-12 max-w-md w-full shadow-2xl animate-fadeIn border border-white/20 relative z-10">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl mb-4 shadow-lg">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
      </div>
      <h2 class="text-3xl font-bold bg-gradient-to-r from-gray-800 to-gray-600 bg-clip-text text-transparent mb-2">Welcome Back</h2>
      <p class="text-gray-500 text-sm">Sign in to your account</p>
    </div>

    <form method="POST" class="space-y-6">
      {% csrf_token %}
      <div class="space-y-4">
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
          </div>
          <input
            type="text"
            name="username"
            placeholder="Username"
            required
            class="w-full pl-12 pr-4 py-4 rounded-xl border border-gray-200 placeholder-gray-400 text-gray-700 bg-gray-50/50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 hover:bg-white"
          />
        </div>
        
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
          </div>
          <input
            type="password"
            name="password"
            placeholder="Password"
            required
            class="w-full pl-12 pr-4 py-4 rounded-xl border border-gray-200 placeholder-gray-400 text-gray-700 bg-gray-50/50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 hover:bg-white"
          />
        </div>
      </div>

      <button
        type="submit"
        class="w-full py-4 rounded-xl bg-gradient-to-r from-blue-600 via-blue-700 to-indigo-700 font-semibold text-white shadow-lg hover:shadow-xl hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 relative overflow-hidden group"
      >
        <span class="relative z-10">Sign In</span>
        <div class="absolute inset-0 bg-gradient-to-r from-blue-700 via-blue-800 to-indigo-800 opacity-0 group-hover:opacity-100 transition-opacity duration-200"></div>
      </button>
    </form>

    <div class="mt-8 text-center">
      <p class="text-gray-600 text-sm">
        Don't have an account? 
        <a href="{% url 'signup' %}" class="font-semibold text-blue-600 hover:text-blue-700 transition-colors duration-200 hover:underline">Create one here</a>
      </p>
    </div>
  </div>
</div>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
  
  @keyframes fadeIn {
    from {
      opacity: 0; 
      transform: translateY(20px) scale(0.95);
    }
    to {
      opacity: 1; 
      transform: translateY(0) scale(1);
    }
  }
  
  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(1deg); }
  }
  
  .animate-fadeIn {
    animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  
  .font-poppins {
    font-family: 'Poppins', sans-serif;
  }
  
  /* Added subtle floating animation for decorative elements */
  .absolute.inset-0 > div:first-child {
    animation: float 6s ease-in-out infinite;
  }
  
  .absolute.inset-0 > div:last-child {
    animation: float 8s ease-in-out infinite reverse;
  }
</style>
{% endblock %}
